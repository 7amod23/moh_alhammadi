# =============================================
# Enhancement #7: Security Headers
# Add these to your web server configuration
# =============================================

# --- For Nginx ---
# Add inside your server { } block:
#
# # Prevent MIME-type sniffing
# add_header X-Content-Type-Options "nosniff" always;
#
# # Prevent clickjacking
# add_header X-Frame-Options "DENY" always;
#
# # Enable HSTS (force HTTPS for 1 year)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
#
# # Referrer policy
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#
# # Permissions policy - disable unnecessary browser features
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
#
# # Content Security Policy
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;


# --- For Apache (.htaccess) ---
# <IfModule mod_headers.c>
#   Header always set X-Content-Type-Options "nosniff"
#   Header always set X-Frame-Options "DENY"
#   Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
#   Header always set Referrer-Policy "strict-origin-when-cross-origin"
#   Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
#   Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';"
# </IfModule>
